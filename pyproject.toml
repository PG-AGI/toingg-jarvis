[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toingg-jarvis"
version = "2.0.0"
description = "Voice-activated desktop assistant and browser automation launcher"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24.0",
    "pyaudio>=0.2.13",
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "websocket-client>=1.6.0",
    "rich>=13.5.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6.3.0",
]

[tool.setuptools]
py-modules = [
    "jarvis_launcher",
    "browserClient",
    "native_file_manager",
    "pipecat_gemini_tools",
]
packages = ["packaging"]
