name: Package native installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stamp into installer names
        required: false
        default: "0.1.0"
  release:
    types: [published]

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      JARVIS_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name || '0.1.0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev dpkg-dev

      - name: Install macOS audio build dependencies
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m playwright install chromium

      - name: Build frozen app
        run: pyinstaller packaging/pyinstaller/jarvis.spec --noconfirm

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/jarvis.iss

      - name: Build Linux deb
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh

      - name: Build macOS dmg
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ runner.os }}-${{ env.JARVIS_VERSION }}
          path: dist/installers/*
          if-no-files-found: error
