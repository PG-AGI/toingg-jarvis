# Target path in repo: .github/workflows/release-installers.yml
name: Build Cross-Platform Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.0)"
        required: false
        default: "2.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install pyinstaller
      - name: Bundle application
        run: pyinstaller --clean --noconfirm packaging/jarvis.spec
      - name: Build Windows .exe installer (Inno Setup)
        run: iscc packaging\windows\jarvis_installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: toingg-jarvis-windows-installer
          path: dist/installers/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install pyinstaller
      - name: Bundle application
        run: pyinstaller --clean --noconfirm packaging/jarvis.spec
      - name: Build Debian .deb package
        run: bash packaging/linux/build_deb.sh "${{ inputs.version || '2.0.0' }}" amd64
      - uses: actions/upload-artifact@v4
        with:
          name: toingg-jarvis-linux-deb
          path: dist/installers/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install pyinstaller
      - name: Bundle application
        run: pyinstaller --clean --noconfirm packaging/jarvis.spec
      - name: Build macOS .app & .dmg installer
        run: bash packaging/macos/build_dmg.sh "${{ inputs.version || '2.0.0' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: toingg-jarvis-macos-dmg
          path: dist/installers/*.dmg
