name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < packaging/VERSION)" >> "$GITHUB_OUTPUT"
          fi

  linux-deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/linux/build_deb.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  windows-exe:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc "/DAppVersion=${{ needs.version.outputs.version }}" packaging\windows\jarvis.iss
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/*.exe

  macos-dmg:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/macos/build_app.sh "${{ needs.version.outputs.version }}" dist
      - name: Sign app (only when a signing identity is configured)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            codesign --force --deep --sign "$MACOS_SIGN_IDENTITY" "dist/Toingg Jarvis.app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-deb, windows-exe, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
