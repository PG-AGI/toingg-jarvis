name: Build Cross-Platform Native Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller sounddevice numpy SpeechRecognition
      - name: Build standalone Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name toingg-jarvis --add-data "jarvis_web.html;." --add-data "jarvis_visual.html;." --add-data "config.example.json;." jarvis_launcher.py
      - name: Build Windows .exe Installer (Inno Setup)
        run: |
          iscc jarvis_packaging/windows/jarvis_installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: toingg-jarvis-windows-exe
          path: dist/installers/*.exe

  package-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2 dpkg-dev
          python -m pip install --upgrade pip pyinstaller sounddevice numpy SpeechRecognition
      - name: Build standalone binary and .deb installer
        run: |
          pyinstaller --noconfirm --clean --onefile --name toingg-jarvis --add-data "jarvis_web.html:." --add-data "jarvis_visual.html:." --add-data "config.example.json:." jarvis_launcher.py
          bash jarvis_packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: toingg-jarvis-linux-deb
          path: dist/installers/*.deb

  package-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          brew install portaudio
          python -m pip install --upgrade pip pyinstaller sounddevice numpy SpeechRecognition
      - name: Build macOS .app bundle and .dmg installer
        run: |
          pyinstaller --noconfirm --clean --windowed --name ToinggJarvis --add-data "jarvis_web.html:." --add-data "jarvis_visual.html:." --add-data "config.example.json:." jarvis_launcher.py
          bash jarvis_packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: toingg-jarvis-macos-dmg
          path: dist/installers/*.dmg
