name: Build Cross-Platform Native Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: jarvis-linux-deb
          - os: macos-latest
            target: macos
            artifact_name: jarvis-macos-dmg
          - os: windows-latest
            target: windows
            artifact_name: jarvis-windows-exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller and runtime dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build standalone bundle with PyInstaller
        run: |
          pyinstaller installers/jarvis.spec --noconfirm

      - name: Stage OS-native installer layout
        run: |
          python installers/build_installers.py --target ${{ matrix.target }} --out-dir dist/installers

      - name: Build Linux .deb package
        if: matrix.target == 'linux'
        run: |
          cp -r dist/jarvis/* dist/installers/linux/jarvis_1.0.0_amd64/opt/jarvis/
          dpkg-deb --build dist/installers/linux/jarvis_1.0.0_amd64 dist/installers/jarvis_1.0.0_amd64.deb

      - name: Build macOS .app and .dmg installer
        if: matrix.target == 'macos'
        run: |
          cp -r dist/jarvis/* dist/installers/macos/JARVIS.app/Contents/Resources/
          hdiutil create -volname "JARVIS Installer" -srcfolder dist/installers/macos/JARVIS.app -ov -format UDZO dist/installers/JARVIS-1.0.0-macOS.dmg

      - name: Build Windows .exe installer with Inno Setup
        if: matrix.target == 'windows'
        run: |
          iscc dist/installers/windows/jarvis.iss

      - name: Upload native installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/installers/
