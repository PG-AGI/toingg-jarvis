name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux display prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Run tests with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -X utf8 -m unittest discover -v
      - name: Run tests
        if: runner.os != 'Linux'
        run: python -X utf8 -m unittest discover -v
