name: build-windows

on:
  push:
    branches: [windows-installer-13, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller one-dir)
        run: pyinstaller jarvis.spec --noconfirm

      - name: Smoke test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\JARVIS\JARVIS.exe --version
          .\dist\JARVIS\JARVIS.exe --help
          .\dist\JARVIS\JARVIS.exe --browser-client --help
          foreach ($f in @("jarvis_web.html", "jarvis_visual.html", "config.example.json")) {
            if (!(Test-Path "dist\JARVIS\$f") -and !(Test-Path "dist\JARVIS\_internal\$f")) { throw "$f missing from bundle" }
          }
          $mb = ((Get-ChildItem -Recurse dist\JARVIS | Measure-Object Length -Sum).Sum / 1MB)
          Write-Output ("bundle size: {0:N1} MB" -f $mb)
          if ($mb -gt 500) { throw "bundle over 500 MB budget" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\jarvis.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            dist/JARVIS/
            installer/Output/*.exe
