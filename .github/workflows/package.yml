name: Package JARVIS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: JARVIS-windows
            archive_name: JARVIS-windows.zip
          - os: macos-latest
            artifact_name: JARVIS-macos
            archive_name: JARVIS-macos.zip
          - os: ubuntu-latest
            artifact_name: JARVIS-linux
            archive_name: JARVIS-linux.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install macOS audio headers
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyaudio numpy websocket-client rich SpeechRecognition playwright playwright-stealth

      - name: Build package
        run: pyinstaller --clean --noconfirm jarvis_launcher.spec

      - name: Add starter files
        shell: bash
        run: |
          cp README.md dist/JARVIS/
          cp JARVIS_README.md dist/JARVIS/
          cp config.example.json dist/JARVIS/

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/JARVIS/* -DestinationPath ${{ matrix.archive_name }}

      - name: Archive macOS package
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/JARVIS ${{ matrix.archive_name }}

      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive_name }} -C dist JARVIS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
