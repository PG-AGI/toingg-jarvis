name: Package JARVIS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux audio headers
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install macOS audio headers
        if: matrix.platform == 'macos'
        run: brew install portaudio

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Stage release files
        run: python scripts/package_release.py --platform ${{ matrix.platform }}

      - name: Build PyInstaller artifact
        run: pyinstaller --clean --noconfirm jarvis.spec

      - name: Upload staged release files
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-stage-${{ matrix.platform }}
          path: dist/release/${{ matrix.platform }}

      - name: Upload PyInstaller output
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-pyinstaller-${{ matrix.platform }}
          path: dist
