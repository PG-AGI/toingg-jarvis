name: Question
description: Something isn't clear? Ask away — no question is too small.
title: "[Question]: "
labels: ["question"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Got a question? Great!
        Before posting, please check:
        - [README.md](../../README.md) and [JARVIS_README.md](../../JARVIS_README.md) for setup help
        - [Existing issues](https://github.com/PG-AGI/toingg-jarvis/issues?q=is%3Aissue) in case it's been asked before
        - [GitHub Discussions](https://github.com/PG-AGI/toingg-jarvis/discussions) for general conversation

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Ask as clearly as you can.
      placeholder: "How do I change the wake word from 'Hey Jarvis' to something custom?"
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What Have You Already Tried?
      description: Let us know what you've looked at or attempted so we don't repeat it.
      placeholder: "I looked in jarvis_launcher.py but couldn't find where the wake word is defined..."

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10
        - Windows 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (Ubuntu/Debian)
        - Linux (Other)
        - Not relevant to my question

  - type: input
    id: python_version
    attributes:
      label: Python Version (if relevant)
      placeholder: "e.g. Python 3.11.2"

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Any screenshots, error messages, or config snippets that might help.
