name: Bug Report
description: Found something broken? Help us squash it!
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for taking the time to report a bug!
        Please fill out as much detail as possible so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I say 'Hey Jarvis', the orb animation freezes after 3 seconds..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we make this happen?
      placeholder: |
        1. Run jarvis_launcher.py
        2. Say "Hey Jarvis"
        3. Observe the orb UI
        4. See the freeze
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The orb should continue animating while listening..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "The orb freezes and no audio is captured..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10
        - Windows 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (Ubuntu/Debian)
        - Linux (Other)
      multiple: false
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: Run `python --version` or `python3 --version`
      placeholder: "e.g. Python 3.11.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Terminal Output
      description: Paste any relevant logs or error messages here.
      render: shell
      placeholder: "Traceback (most recent call last):..."

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, config snippets, or anything else that might help.
